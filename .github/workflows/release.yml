# Automatic releases with semantic-release (config: .releaserc.json).
#
# Push to main → if there are feat:/fix:/perf: (or breaking) commits since the last tag, this works
# out the next version from those commit messages, tags it and publishes a GitHub Release with the
# notes. Nothing is committed back to main, so you never have to pull after a release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create the tag and the GitHub Release
  issues: write # comment on issues fixed by a release (and open one if a release fails)
  pull-requests: write # comment on PRs included in a release

# Two quick pushes must not both try to cut the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to find the last release and the commits since

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run from npx rather than devDependencies: the app doesn't need it, and CI pins the versions here.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes -p semantic-release@25 -p conventional-changelog-conventionalcommits@9 semantic-release
