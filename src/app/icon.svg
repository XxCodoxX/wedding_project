<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Radiant 24K Gold Gradient -->
    <linearGradient id="tabGold" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="55%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>

    <!-- Brilliant Cut Diamond Gradient -->
    <linearGradient id="tabDiamond" x1="32" y1="8" x2="32" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E3F2FD" />
      <stop offset="100%" stop-color="#90CAF9" />
    </linearGradient>
  </defs>

  <!-- Badge Background -->
  <rect width="64" height="64" rx="16" fill="#131722" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#tabGold)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left Ring - Brilliant Gold -->
  <circle cx="25.5" cy="38.5" r="13.5" stroke="url(#tabGold)" stroke-width="4.5" fill="none" />

  <!-- Right Ring - Brilliant Gold -->
  <circle cx="38.5" cy="38.5" r="13.5" stroke="url(#tabGold)" stroke-width="4.5" fill="none" />

  <!-- Interlocking Arch Overlap -->
  <path d="M 32 25.5 A 13.5 13.5 0 0 1 39 36" stroke="url(#tabGold)" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Diamond Mount Prongs -->
  <path d="M27 20 L32 23 L37 20" stroke="url(#tabGold)" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="32" cy="23.5" r="2" fill="url(#tabGold)" />

  <!-- Brilliant Cut Diamond Facets -->
  <path d="M26.5 14 L37.5 14 L42 19 L32 27 L22 19 Z" fill="url(#tabDiamond)" />
  <path d="M26.5 14 L32 19 L37.5 14 M32 19 L32 27 M22 19 L42 19 M26.5 14 L32 27 M37.5 14 L32 27" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.95" fill="none" />

  <!-- Top Diamond Sparkle Star (✦) -->
  <path d="M32 6 L33.4 10.5 L38 11.5 L33.4 12.5 L32 17 L30.6 12.5 L26 11.5 L30.6 10.5 Z" fill="#FFFFFF" />
  <circle cx="32" cy="11.5" r="1" fill="#FFF9D2" />

  <!-- Ambient Corner Sparkles -->
  <path d="M48 20 L48.8 22.5 L51 23 L48.8 23.5 L48 26 L47.2 23.5 L45 23 L47.2 22.5 Z" fill="#FFD54F" />
  <path d="M14 26 L14.6 28 L16.5 28.5 L14.6 29 L14 31 L13.4 29 L11.5 28.5 L13.4 28 Z" fill="#FFD54F" opacity="0.8" />
</svg>
